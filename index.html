<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="description" content="8人制サッカー 1Dayトーナメント 出場時間・フォーメーション管理アプリ">
  <title>&#x26BD; 出場管理 - 8人制サッカー</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg-primary: #0a0e1a; --bg-secondary: #111827;
      --bg-card: rgba(17,24,39,0.85); --bg-glass: rgba(30,41,59,0.6);
      --bg-input: rgba(30,41,59,0.8); --border-glass: rgba(99,130,255,0.15);
      --border-subtle: rgba(148,163,184,0.12);
      --accent-primary: #6366f1; --accent-secondary: #818cf8;
      --accent-glow: rgba(99,102,241,0.3); --accent-green: #22c55e;
      --accent-green-glow: rgba(34,197,94,0.25); --accent-amber: #f59e0b;
      --accent-amber-glow: rgba(245,158,11,0.25); --accent-red: #ef4444;
      --accent-red-glow: rgba(239,68,68,0.2); --accent-cyan: #06b6d4;
      --text-primary: #f1f5f9; --text-secondary: #94a3b8;
      --text-muted: #64748b; --text-accent: #a5b4fc;
      --radius-sm: 8px; --radius-md: 12px; --radius-lg: 16px; --radius-xl: 20px;
      --shadow-sm: 0 2px 8px rgba(0,0,0,0.3); --shadow-md: 0 4px 16px rgba(0,0,0,0.4);
      --shadow-lg: 0 8px 32px rgba(0,0,0,0.5); --shadow-glow: 0 0 20px var(--accent-glow);
      --font-main: 'Inter','Noto Sans JP',-apple-system,sans-serif;
      --transition: 0.2s cubic-bezier(0.4,0,0.2,1);
    }
    html { font-size: 14px; -webkit-tap-highlight-color: transparent; }
    body { font-family: var(--font-main); background: var(--bg-primary); color: var(--text-primary); min-height: 100dvh; overflow-x: hidden; -webkit-font-smoothing: antialiased; }
    body::before { content:''; position:fixed; top:-50%; left:-50%; width:200%; height:200%; background: radial-gradient(ellipse at 30% 20%,rgba(99,102,241,0.08) 0%,transparent 50%), radial-gradient(ellipse at 70% 80%,rgba(6,182,212,0.05) 0%,transparent 50%); z-index:0; pointer-events:none; }

    /* Header */
    .header { position:sticky; top:0; z-index:100; background:rgba(10,14,26,0.92); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); border-bottom:1px solid var(--border-glass); padding:12px 16px; }
    .header-top { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
    .app-title { font-size:1.25rem; font-weight:800; background:linear-gradient(135deg,#818cf8,#06b6d4); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; letter-spacing:-0.02em; }
    .header-actions { display:flex; gap:8px; }
    .summary-bar { display:flex; gap:6px; overflow-x:auto; padding:2px 0; scrollbar-width:none; -ms-overflow-style:none; }
    .summary-bar::-webkit-scrollbar { display:none; }
    .summary-chip { display:flex; align-items:center; gap:4px; padding:4px 10px; background:var(--bg-glass); border:1px solid var(--border-subtle); border-radius:50px; font-size:0.72rem; font-weight:500; color:var(--text-secondary); white-space:nowrap; flex-shrink:0; }
    .summary-chip .count { display:inline-flex; align-items:center; justify-content:center; min-width:18px; height:18px; padding:0 5px; background:var(--accent-primary); color:white; border-radius:50px; font-size:0.65rem; font-weight:700; }
    .summary-chip .count.high { background:var(--accent-green); }
    .summary-chip .count.low { background:var(--accent-amber); }
    .summary-chip .count.both { background:linear-gradient(135deg, #a855f7, #ec4899); color:white; border:none; }
    .summary-chip .player-edit-btn { background:none; border:none; color:var(--accent-cyan); font-size:0.75rem; cursor:pointer; padding:0 2px; }
    .summary-chip .player-del-btn { background:none; border:none; color:var(--accent-red); font-size:0.9rem; cursor:pointer; padding:0 2px; line-height:1; }

    /* Buttons */
    .btn { display:inline-flex; align-items:center; gap:5px; padding:8px 14px; border:none; border-radius:var(--radius-sm); font-family:var(--font-main); font-size:0.82rem; font-weight:600; cursor:pointer; transition:all var(--transition); white-space:nowrap; -webkit-user-select:none; user-select:none; }
    .btn-primary { background:linear-gradient(135deg,var(--accent-primary),#4f46e5); color:white; box-shadow:0 2px 10px var(--accent-glow); }
    .btn-primary:active { transform:scale(0.95); }
    .btn-success { background:linear-gradient(135deg,var(--accent-green),#16a34a); color:white; box-shadow:0 2px 10px var(--accent-green-glow); }
    .btn-success:active { transform:scale(0.95); }
    .btn-danger { background:rgba(239,68,68,0.15); color:var(--accent-red); border:1px solid rgba(239,68,68,0.25); }
    .btn-danger:active { background:rgba(239,68,68,0.3); transform:scale(0.95); }
    .btn-ghost { background:var(--bg-glass); color:var(--text-secondary); border:1px solid var(--border-subtle); }
    .btn-ghost:active { background:rgba(30,41,59,0.9); transform:scale(0.95); }
    .btn-sm { padding:5px 10px; font-size:0.75rem; }

    /* Main */
    .main { position:relative; z-index:1; padding:16px; padding-bottom:100px; max-width:800px; margin:0 auto; }
    .section-title { display:flex; align-items:center; gap:8px; font-size:0.8rem; font-weight:700; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.08em; margin-bottom:12px; }
    .section-title::after { content:''; flex:1; height:1px; background:linear-gradient(90deg,var(--border-subtle),transparent); }

    /* Match Card */
    .match-card { background:var(--bg-card); border:1px solid var(--border-glass); border-radius:var(--radius-lg); margin-bottom:16px; overflow:hidden; backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); box-shadow:var(--shadow-md); animation:fadeSlideIn 0.3s ease-out; }
    @keyframes fadeSlideIn { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }
    .match-header { display:flex; align-items:center; justify-content:space-between; padding:14px 16px; background:linear-gradient(135deg,rgba(99,102,241,0.1),rgba(6,182,212,0.05)); border-bottom:1px solid var(--border-glass); }
    .match-info { flex:1; }
    .match-name { font-size:1rem; font-weight:700; color:var(--text-primary); margin-bottom:3px; }
    .match-meta { display:flex; align-items:center; gap:10px; font-size:0.75rem; color:var(--text-muted); }
    .match-actions { display:flex; gap:6px; }

    /* Table */
    .table-wrapper { overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none; }
    .table-wrapper::-webkit-scrollbar { display:none; }
    .match-table { min-width:max-content; border-collapse:collapse; background:var(--bg-card); }
    .match-table th, .match-table td { text-align:center; padding:0; border:1px solid var(--border-subtle); }
    .match-table th { padding:8px 6px; font-size:0.7rem; font-weight:600; color:var(--text-secondary); background:rgba(30,41,59,0.5); white-space:nowrap; position:relative; }
    .match-table th.player-col { min-width:52px; max-width:64px; }
    .match-table th .player-delete { position:absolute; top:1px; right:1px; width:14px; height:14px; font-size:8px; line-height:14px; background:rgba(239,68,68,0.5); color:white; border:none; border-radius:50%; cursor:pointer; display:none; align-items:center; justify-content:center; }
    .match-table th .player-edit { position:absolute; top:1px; left:1px; width:14px; height:14px; font-size:8px; line-height:14px; background:rgba(6,182,212,0.5); color:white; border:none; border-radius:50%; cursor:pointer; display:none; align-items:center; justify-content:center; }
    .edit-mode .match-table th .player-delete,
    .edit-mode .match-table th .player-edit { display:flex; }
    .match-table th:first-child,
    .match-table td:first-child { position:sticky; left:0; z-index:20; border-right:1px solid var(--border-subtle); }
    .match-table th:first-child { background:#1e293b; z-index:21; }
    .match-table td.half-label { padding:6px 10px; font-size:0.72rem; font-weight:700; color:var(--text-accent); background:#172033; white-space:nowrap; min-width:50px; text-align:left; }
    .match-table td.half-label.second-half { color:var(--accent-cyan); background:#152737; }

    /* Cell */
    .cell { width:52px; height:44px; cursor:pointer; position:relative; transition:background var(--transition); -webkit-user-select:none; user-select:none; }
    .cell:active { background:rgba(99,102,241,0.15); }
    .cell .cell-content { display:flex; align-items:center; justify-content:center; width:100%; height:100%; font-size:1rem; font-weight:700; transition:all 0.15s ease; }
    .cell[data-status="play"] { background:rgba(34,197,94,0.08); }
    .cell[data-status="play"] .cell-content { color:var(--accent-green); font-size:1.2rem; }
    .cell[data-status="gk"] { background:rgba(245,158,11,0.08); }
    .cell[data-status="gk"] .cell-content { color:var(--accent-amber); font-size:0.7rem; font-weight:800; letter-spacing:0.03em; }
    @keyframes cellPop { 0%{transform:scale(0.7);opacity:0.5} 50%{transform:scale(1.15)} 100%{transform:scale(1);opacity:1} }

    /* Count Row */
    .match-table tr.count-row td { padding:6px 4px; font-size:0.7rem; font-weight:700; color:var(--text-muted); background:rgba(30,41,59,0.3); border-top:2px solid var(--border-glass); }
    .match-table tr.count-row td.count-label { text-align:left; padding-left:10px; color:var(--text-secondary); background:#1a2233; }

    /* Total Summary */
    .total-section { margin-top:24px; }
    .total-card { background:var(--bg-card); border:1px solid var(--border-glass); border-radius:var(--radius-lg); overflow:hidden; backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); box-shadow:var(--shadow-md); }
    .total-card .total-header { padding:14px 16px; background:linear-gradient(135deg,rgba(34,197,94,0.1),rgba(6,182,212,0.05)); border-bottom:1px solid var(--border-glass); font-size:0.9rem; font-weight:700; }
    .total-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:1px; background:var(--border-subtle); }
    .total-item { display:flex; align-items:center; justify-content:space-between; padding:12px 14px; background:var(--bg-secondary); }
    .total-item .player-name { font-size:0.82rem; font-weight:600; color:var(--text-primary); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; flex:1; margin-right:8px; }
    .total-item .total-count { display:inline-flex; align-items:center; justify-content:center; min-width:28px; height:28px; padding:0 8px; border-radius:50px; font-size:0.8rem; font-weight:800; }
    .total-item .total-count.top { background:rgba(34,197,94,0.15); color:var(--accent-green); }
    .total-item .total-count.mid { background:rgba(99,102,241,0.15); color:var(--accent-secondary); }
    .total-item .total-count.low { background:rgba(245,158,11,0.15); color:var(--accent-amber); }
    .total-item .total-count.zero { background:rgba(239,68,68,0.1); color:var(--accent-red); }

    /* Modal */
    .modal-overlay { position:fixed; inset:0; z-index:200; background:rgba(0,0,0,0.6); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); display:flex; align-items:flex-end; justify-content:center; opacity:0; pointer-events:none; transition:opacity 0.25s ease; }
    .modal-overlay.active { opacity:1; pointer-events:auto; }
    .modal { background:var(--bg-secondary); border:1px solid var(--border-glass); border-radius:var(--radius-xl) var(--radius-xl) 0 0; width:100%; max-width:500px; padding:24px 20px; padding-bottom:calc(24px + env(safe-area-inset-bottom,0px)); transform:translateY(100%); transition:transform 0.3s cubic-bezier(0.4,0,0.2,1); }
    .modal-overlay.active .modal { transform:translateY(0); }
    .modal-handle { width:36px; height:4px; background:var(--text-muted); border-radius:2px; margin:0 auto 18px; }
    .modal h2 { font-size:1.1rem; font-weight:700; margin-bottom:18px; }
    .form-group { margin-bottom:14px; }
    .form-group label { display:block; font-size:0.75rem; font-weight:600; color:var(--text-secondary); margin-bottom:6px; }
    .form-group input { width:100%; padding:10px 14px; background:var(--bg-input); border:1px solid var(--border-subtle); border-radius:var(--radius-sm); color:var(--text-primary); font-family:var(--font-main); font-size:0.9rem; transition:border-color var(--transition); outline:none; }
    .form-group input:focus { border-color:var(--accent-primary); box-shadow:0 0 0 3px var(--accent-glow); }
    .form-group input::placeholder { color:var(--text-muted); }
    .modal-actions { display:flex; gap:10px; margin-top:20px; }
    .modal-actions .btn { flex:1; justify-content:center; padding:12px; }

    /* Empty State */
    .empty-state { text-align:center; padding:48px 20px; color:var(--text-muted); }
    .empty-state .empty-icon { font-size:3rem; margin-bottom:12px; }
    .empty-state p { font-size:0.85rem; margin-bottom:16px; }

    /* FAB */
    .fab-container { position:fixed; bottom:calc(20px + env(safe-area-inset-bottom,0px)); right:20px; z-index:50; display:flex; flex-direction:column; gap:10px; align-items:flex-end; }
    .fab { width:auto; padding:0 24px; height:52px; border:none; border-radius:50px; font-size:1.05rem; font-weight:700; cursor:pointer; box-shadow:var(--shadow-lg); display:flex; align-items:center; justify-content:center; transition:all var(--transition); letter-spacing:0.02em; }
    .fab:active { transform:scale(0.9); }
    .fab-match { background:linear-gradient(135deg,var(--accent-primary),#4f46e5); color:white; box-shadow:0 4px 15px rgba(99,102,241,0.4); }

    /* Edit Toggle */
    .edit-toggle { position:relative; }
    .edit-toggle.active { background:rgba(239,68,68,0.15) !important; color:var(--accent-red) !important; border-color:rgba(239,68,68,0.3) !important; }

    /* Toast */
    .toast { position:fixed; bottom:90px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--bg-secondary); border:1px solid var(--border-glass); color:var(--text-primary); padding:10px 20px; border-radius:50px; font-size:0.8rem; font-weight:500; box-shadow:var(--shadow-lg); opacity:0; pointer-events:none; transition:all 0.3s ease; z-index:300; white-space:nowrap; }
    .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

    /* Match Edit Inline */
    .match-edit-row { display:flex; gap:8px; padding:10px 16px; background:rgba(30,41,59,0.3); border-bottom:1px solid var(--border-subtle); }
    .match-edit-row input { flex:1; padding:6px 10px; background:var(--bg-input); border:1px solid var(--border-subtle); border-radius:var(--radius-sm); color:var(--text-primary); font-family:var(--font-main); font-size:0.78rem; outline:none; }
    .match-edit-row input:focus { border-color:var(--accent-primary); }

    /* Data Actions */
    .data-actions { display:flex; gap:8px; justify-content:center; margin-top:24px; padding-bottom:20px; }

    /* Formation Section */
    .formation-section { border-top:1px solid var(--border-subtle); padding:14px 16px; background:rgba(10,14,26,0.4); }
    .formation-title { font-size:0.72rem; font-weight:700; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.07em; margin-bottom:12px; }
    .formation-halves { display:block; }
    .formation-half-block { display:flex; flex-direction:column; gap:8px; }
    .formation-half-label { font-size:0.7rem; font-weight:700; color:var(--text-accent); margin-bottom:2px; }
    .formation-half-label.second { color:var(--accent-cyan); }
    .formation-inputs { display:flex; align-items:center; gap:6px; }
    .formation-field { display:flex; flex-direction:column; align-items:center; gap:3px; }
    .formation-field label { font-size:0.6rem; font-weight:700; color:var(--text-muted); text-transform:uppercase; }
    .formation-field label.fw-label { color:#f87171; }
    .formation-field label.mf-label { color:#34d399; }
    .formation-field label.df-label { color:#60a5fa; }
    .formation-num { display:flex; align-items:center; gap:3px; }
    .formation-num button { width:22px; height:22px; background:var(--bg-glass); border:1px solid var(--border-subtle); border-radius:50%; color:var(--text-secondary); font-size:0.9rem; line-height:1; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:all var(--transition); -webkit-user-select:none; user-select:none; }
    .formation-num button:active { background:var(--accent-primary); color:white; transform:scale(0.9); }
    .formation-num span { min-width:18px; text-align:center; font-size:0.9rem; font-weight:800; color:var(--text-primary); }
    .formation-badge { padding:2px 8px; background:rgba(99,102,241,0.15); border:1px solid rgba(99,102,241,0.3); border-radius:50px; font-size:0.68rem; font-weight:700; color:var(--accent-secondary); margin-left:auto; white-space:nowrap; }
    .pitch-wrap { display:flex; flex-direction:column; gap:4px; }
    .pitch-svg-container { width:100%; height:auto; display:block; border-radius:var(--radius-sm); overflow:hidden; }



    ::-webkit-scrollbar { width:4px; height:4px; }
    ::-webkit-scrollbar-track { background:transparent; }
    ::-webkit-scrollbar-thumb { background:var(--text-muted); border-radius:2px; }

    /* Player Edit Mode Overlay */
    body.player-edit-active #header,
    body.player-edit-active .match-card,
    body.player-edit-active .fab-container {
      pointer-events: none;
      opacity: 0.4;
      filter: grayscale(80%);
    }

    @media (min-width:600px) { html { font-size:15px; } .main { padding:24px; padding-bottom:100px; } }
  </style>
</head>
<body>

  <header class="header" id="header">
    <div class="header-top" style="margin-bottom:0;">
      <h1 class="app-title">&#x26BD; 出場管理</h1>
      <div class="header-actions">
        <button class="btn btn-primary btn-sm" style="padding:6px 12px; margin-right:8px; font-weight:bold;" onclick="openMatchModal()">&#xFF0B; 試合</button>
        <button class="btn btn-ghost btn-sm edit-toggle" id="editToggle" onclick="toggleEditMode()">&#x270F;&#xFE0F; 試合編集</button>
      </div>
    </div>
  </header>

  <main class="main" id="mainContent"></main>


  <!-- 選手追加モーダル -->
  <div class="modal-overlay" id="playerModal">
    <div class="modal">
      <div class="modal-handle"></div>
      <h2>&#x1F464; 選手を追加</h2>
      <div class="form-group">
        <label for="playerNameInput">選手名を入力</label>
        <input type="text" id="playerNameInput" placeholder="例: たろう" enterkeyhint="done">
      </div>

      <div class="modal-actions">
        <button class="btn btn-ghost" onclick="closeModal('playerModal')">キャンセル</button>
        <button class="btn btn-success" onclick="addPlayer()">追加</button>
      </div>
    </div>
  </div>


  <!-- 試合追加モーダル -->
  <div class="modal-overlay" id="matchModal">
    <div class="modal">
      <div class="modal-handle"></div>
      <h2>&#x1F3DF;&#xFE0F; 試合を追加</h2>
      <div class="form-group">
        <label for="matchNameInput">試合名</label>
        <input type="text" id="matchNameInput" placeholder="例: 予選①" enterkeyhint="next">
      </div>
      <div class="form-group">
        <label for="matchOpponentInput">対戦相手</label>
        <input type="text" id="matchOpponentInput" placeholder="例: ○○FC" enterkeyhint="next">
      </div>
      <div class="form-group">
        <label for="matchTimeInput">試合時間</label>
        <input type="text" id="matchTimeInput" placeholder="例: 13:15" enterkeyhint="done">
      </div>
      <div class="modal-actions">
        <button class="btn btn-ghost" onclick="closeModal('matchModal')">キャンセル</button>
        <button class="btn btn-primary" onclick="addMatch()">追加</button>
      </div>
    </div>
  </div>

  <!-- ポジション選択モーダル -->
  <div class="modal-overlay" id="posModal">
    <div class="modal" style="max-width: 340px; margin:0 auto; padding-bottom:calc(30px + env(safe-area-inset-bottom,0px));">
      <div class="modal-handle"></div>
      <h3 style="text-align:center; font-size:1.1rem; margin-bottom:20px; color:var(--text-primary);" id="posModalTitle">選手を選択</h3>
      <div id="posModalList" style="display:flex; flex-direction:column; max-height:60vh; overflow-y:auto; gap:4px; margin-bottom:12px; padding:4px;"></div>
      <button class="btn btn-ghost" style="width:100%; justify-content:center; padding:12px; border:1px solid var(--border-glass); color:var(--text-muted);" onclick="closeModal('posModal')">キャンセル</button>
    </div>
  </div>

  <!-- 状態選択モーダル -->
  <div class="modal-overlay" id="statusModal">
    <div class="modal" style="max-width: 320px; margin:0 auto;">
      <div class="modal-handle"></div>
      <h3 style="text-align:center; font-size:1.1rem; margin-bottom:20px; color:var(--text-primary);" id="statusModalTitle">選手状態</h3>
      <div id="statusModalButtons" style="display:flex; flex-wrap:wrap; gap:8px; margin-bottom:20px; justify-content:center;">
        <!-- Dynamic buttons go here -->
      </div>
      <div style="display:flex; gap:8px;">
        <button class="btn btn-primary" style="flex:1; background:rgba(245,158,11,0.15); color:var(--accent-amber); font-size:1.1rem; height:48px;" onclick="setStatusFromModal('gk')">GK</button>
        <button class="btn btn-ghost" style="flex:1; background:rgba(156,163,175,0.15); color:var(--text-muted); font-size:1rem; height:48px; font-weight:bold;" onclick="setStatusFromModal('rest')">休 憩</button>
        <button class="btn btn-ghost" style="flex:1; background:rgba(255,255,255,0.05); color:var(--text-muted); font-size:1rem; height:48px;" onclick="setStatusFromModal('none')">クリア</button>
      </div>
    </div>
  </div>

  <!-- 休憩者一覧モーダル -->
  <div class="modal-overlay" id="restingPlayersModal">
    <div class="modal" style="max-width: 320px; margin:0 auto;">
      <div class="modal-handle"></div>
      <h3 style="text-align:center; font-size:1.1rem; margin-bottom:16px; color:var(--text-primary);" id="restingPlayersModalTitle">休憩者一覧</h3>
      <div id="restingPlayersList" style="display:flex; flex-wrap:wrap; gap:8px; margin-bottom:20px; justify-content:center;"></div>
      <button class="btn btn-ghost" style="width:100%; justify-content:center; padding:12px; border:1px solid var(--border-glass); color:var(--text-muted);" onclick="closeModal('restingPlayersModal')">閉じる</button>
    </div>
  </div>

  <!-- 選手履歴モーダル -->
  <div class="modal-overlay" id="playerHistoryModal">
    <div class="modal" style="max-width: 360px; margin:0 auto; max-height:80vh; display:flex; flex-direction:column;">
      <div class="modal-handle"></div>
      <h3 style="text-align:center; font-size:1.1rem; margin-bottom:16px; color:var(--text-primary);" id="playerHistoryModalTitle"></h3>
      <div id="playerHistoryList" style="overflow-y:auto; flex:1; display:flex; flex-direction:column; gap:8px; margin-bottom:16px;"></div>
      <button class="btn btn-ghost" style="width:100%; justify-content:center; padding:12px; border:1px solid var(--border-glass); color:var(--text-muted);" onclick="closeModal('playerHistoryModal')">閉じる</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const STORAGE_KEY = 'soccer8_tournament_v2';

    let state = { players: [], matches: [], editMode: false };
    let sheetPlayers = [];

    // ===== Persistence =====
    function saveState() {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ players: state.players, matches: state.matches })); } catch(e) {}
    }
    function loadState() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          const p = JSON.parse(saved);
          state.players = p.players || [];
          state.matches = p.matches || [];
          state.matches.forEach(m => {
            if (!m.formation) m.formation = { '\u524d\u534a': {df:3,mf:3,fw:1}, '\u5f8c\u534a': {df:3,mf:3,fw:1} };
          });
        }
      } catch(e) {}
    }

    function generateId() { return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg; t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2000);
    }
    function escHtml(str) {
      if (!str) return '';
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
    }

    // ===== Player =====
    function openPlayerModal() {
      document.getElementById('playerModal').classList.add('active');
      setTimeout(() => document.getElementById('playerNameInput').focus(), 300);
    }
    function addPlayerOne(name) {
      if (!name || state.players.includes(name)) return false;
      state.players.push(name);
      state.matches.forEach(m => {
        ['\u524d\u534a','\u5f8c\u534a'].forEach(h => { if (!m.appearances[h][name]) m.appearances[h][name] = 'none'; });
      });
      return true;
    }
    function addPlayer() {
      const input = document.getElementById('playerNameInput');
      const name = input.value.trim();
      if (!name) return;
      if (state.players.includes(name)) { showToast('\u26a0\ufe0f \u540c\u3058\u540d\u524d\u306e\u9078\u624b\u304c\u3044\u307e\u3059'); return; }
      addPlayerOne(name);
      input.value = '';
      closeModal('playerModal');
      saveState(); render();
      showToast('\uD83D\uDC64 ' + name + ' \u3092\u8ffd\u52a0\u3057\u307e\u3057\u305f');
    }
    function editPlayer(oldName) {
      const newName = prompt('\u300c' + oldName + '\u300d\u306e\u65b0\u3057\u3044\u540d\u524d\u3092\u5165\u529b\u3057\u3066\u304f\u3060\u3055\u3044\u3002', oldName);
      if (!newName || newName.trim() === '' || newName === oldName) return;
      const n = newName.trim();
      if (state.players.includes(n)) {
        showToast('\u26a0\ufe0f \u3059\u3067\u306b\u540c\u3058\u540d\u524d\u306e\u9078\u624b\u304c\u3044\u307e\u3059');
        return;
      }
      const idx = state.players.indexOf(oldName);
      if (idx !== -1) state.players[idx] = n;
      state.matches.forEach(m => {
        ['\u524d\u534a','\u5f8c\u534a'].forEach(h => {
          if (m.appearances[h][oldName] !== undefined) {
            m.appearances[h][n] = m.appearances[h][oldName];
            delete m.appearances[h][oldName];
          }
        });
      });
      saveState(); render();
      showToast('\u270f\ufe0f \u540d\u524d\u3092\u5909\u66f4\u3057\u307e\u3057\u305f');
    }
    function removePlayer(name) {
      if (!confirm('\u300c' + name + '\u300d\u3092\u524a\u9664\u3057\u307e\u3059\u304b\uff1f\n\u5168\u8a66\u5408\u306e\u30c7\u30fc\u30bf\u3082\u524a\u9664\u3055\u308c\u307e\u3059\u3002')) return;
      state.players = state.players.filter(p => p !== name);
      state.matches.forEach(m => { ['\u524d\u534a','\u5f8c\u534a'].forEach(h => { delete m.appearances[h][name]; }); });
      saveState(); render();
      showToast('\uD83D\uDDD1\uFE0F ' + name + ' \u3092\u524a\u9664\u3057\u307e\u3057\u305f');
    }

    // ===== Match =====
    function openMatchModal() {
      document.getElementById('matchModal').classList.add('active');
      setTimeout(() => document.getElementById('matchNameInput').focus(), 300);
    }
    function addMatch() {
      const nameInput = document.getElementById('matchNameInput');
      const opponentInput = document.getElementById('matchOpponentInput');
      const timeInput = document.getElementById('matchTimeInput');
      const name = nameInput.value.trim();
      if (!name) { showToast('\u26a0\ufe0f \u8a66\u5408\u540d\u3092\u5165\u529b\u3057\u3066\u304f\u3060\u3055\u3044'); return; }
      const appearances = {'\u524d\u534a':{},'\u5f8c\u534a':{}};
      state.players.forEach(p => { appearances['\u524d\u534a'][p]='none'; appearances['\u5f8c\u534a'][p]='none'; });
      state.matches.push({
        id: generateId(), name: name,
        opponent: opponentInput.value.trim(),
        time: timeInput.value.trim(),
        appearances: appearances,
        formation: {'\u524d\u534a':{df:3,mf:3,fw:1},'\u5f8c\u534a':{df:3,mf:3,fw:1}}
      });
      nameInput.value = ''; opponentInput.value = ''; timeInput.value = '';
      closeModal('matchModal');
      saveState(); render();
      showToast('\uD83C\uDFDF\uFE0F ' + name + ' \u3092\u8ffd\u52a0\u3057\u307e\u3057\u305f');
    }
    function removeMatch(matchId) {
      const match = state.matches.find(m => m.id === matchId);
      if (!match) return;
      if (!confirm('\u300c' + match.name + '\u300d\u3092\u524a\u9664\u3057\u307e\u3059\u304b\uff1f')) return;
      state.matches = state.matches.filter(m => m.id !== matchId);
      saveState(); render();
      showToast('\uD83D\uDDD1\uFE0F ' + match.name + ' \u3092\u524a\u9664\u3057\u307e\u3057\u305f');
    }
    function updateMatchField(matchId, field, value) {
      const match = state.matches.find(m => m.id === matchId);
      if (match) { match[field] = value; saveState(); renderSummaryBar(); }
    }

    // ===== Formation =====
    function updateFormation(matchId, half, pos, delta) {
      const match = state.matches.find(m => m.id === matchId);
      if (!match) return;
      if (!match.formation) match.formation = {'\u524d\u534a':{df:3,mf:3,fw:1},'\u5f8c\u534a':{df:3,mf:3,fw:1}};
      if (!match.formation[half]) match.formation[half] = {df:3,mf:3,fw:1};
      const f = match.formation[half];
      const total = f.df + f.mf + f.fw;
      const newVal = f[pos] + delta;
      if (newVal < 0) return;
      if (delta > 0 && total >= 7) return;
      f[pos] = newVal;

      if (!state.customPositions) state.customPositions = {};
      if (!state.customPositions[matchId]) state.customPositions[matchId] = {};
      state.customPositions[matchId][half] = {};

      saveState();
      updatePitchSvg(matchId, half);
      const halfIdx = half === '\u524d\u534a' ? '1' : '2';
      const badge = document.getElementById('formation-badge-' + matchId + '-' + halfIdx);
      if (badge) badge.textContent = 'GK-' + f.df + '-' + f.mf + '-' + f.fw;
      ['df','mf','fw'].forEach(p => {
        const el = document.getElementById('f-' + matchId + '-' + half + '-' + p);
        if (el) el.textContent = match.formation[half][p];
      });
    }
    function updatePitchSvg(matchId, half) {
      const match = state.matches.find(m => m.id === matchId);
      if (!match) return;
      const svgId = 'pitch-svg-' + matchId + '-' + (half === '\u524d\u534a' ? '1' : '2');
      const el = document.getElementById(svgId);
      if (el) el.innerHTML = buildPitchContent(match.formation[half] || {df:3,mf:3,fw:1}, match, half);
    }
    function buildPitchContent(f, match, half) {
      const df = f.df||0, mf = f.mf||0, fw = f.fw||0;
      const W=140, H=200;
      const yGk=H-20, yDf=H-65, yMf=H-115, yFw=H-158;

      let playPlayers = [];
      let gkPlayer = '';
      if (match && half) {
        let fpList = [];
        const posOrder = {'D':1, 'M':2, 'F':3};
        state.players.forEach(p => {
          const s = match.appearances[half][p];
          if (s === 'gk') gkPlayer = p;
          else if (s && (s.startsWith('DF') || s.startsWith('MF') || s.startsWith('FW'))) {
             fpList.push({ name: p, s: s });
          }
          else if (s >= '1' && s <= '7') {
             fpList.push({ name: p, s: 'Z' + s });
          }
          else if (s === 'play') fpList.push({ name: p, s: 'Z99' });
        });
        fpList.sort((a,b) => {
          const aGrp = posOrder[a.s.charAt(0)] || 9;
          const bGrp = posOrder[b.s.charAt(0)] || 9;
          if (aGrp !== bGrp) return aGrp - bGrp;
          return a.s.localeCompare(b.s);
        });
        playPlayers = fpList.map(x => x.name);
      }
      function shortName(n) { return n ? n.split(/[ \u3000]/)[0].substring(0,4) : ''; }

      let pIdx = 0;
      function dots(count,y,color,prefix) {
        if (count===0) return '';
        const sp=W/(count+1); let out='';
        for (let i=0;i<count;i++) {
          let cx=sp*(i+1);
          let cy=y;
          let posStr = prefix === 'GK' ? 'gk' : prefix + (i+1);
          
          if (state.customPositions && state.customPositions[match.id] && state.customPositions[match.id][half] && state.customPositions[match.id][half][posStr]) {
             cx = state.customPositions[match.id][half][posStr].x;
             cy = state.customPositions[match.id][half][posStr].y;
          }

          let assignedPlayer = '';
          if (prefix === 'GK') {
            assignedPlayer = gkPlayer;
          } else {
            let p = state.players.find(p => match.appearances[half][p] === posStr);
            if (p) {
              assignedPlayer = p;
            } else {
              while (pIdx < playPlayers.length) {
                let checkP = playPlayers[pIdx++];
                let s = match.appearances[half][checkP];
                if (s !== 'gk' && !s.startsWith('DF') && !s.startsWith('MF') && !s.startsWith('FW')) {
                  assignedPlayer = checkP;
                  break;
                }
              }
            }
          }
          let label = assignedPlayer ? shortName(assignedPlayer) : (prefix === 'GK' ? 'GK' : posStr);
          out+='<g class="draggable-pos" data-match="'+match.id+'" data-half="'+half+'" data-pos="'+posStr+'" transform="translate('+cx+','+cy+')" style="cursor:pointer; -webkit-tap-highlight-color:transparent;">'
              +'<circle cx="0" cy="0" r="15" fill="'+color+'" opacity="0.95"/>';
          const fs = label.length > 3 ? 5 : 6.5;
          const textCol = assignedPlayer ? '#0a0e1a' : 'rgba(10,14,26,0.6)';
          out+='<text x="0" y="2.5" text-anchor="middle" font-size="'+fs+'" font-weight="700" fill="'+textCol+'">'+escHtml(label)+'</text>'
              +'</g>';
        }
        return out;
      }
      return '<rect x="0" y="0" width="'+W+'" height="'+H+'" fill="#1a3a2a"/>'
        +'<rect x="8" y="8" width="'+(W-16)+'" height="'+(H-16)+'" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>'
        +'<line x1="8" y1="'+(H/2)+'" x2="'+(W-8)+'" y2="'+(H/2)+'" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>'
        +'<circle cx="'+(W/2)+'" cy="'+(H/2)+'" r="20" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>'
        +'<rect x="32" y="8" width="'+(W-64)+'" height="30" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>'
        +'<rect x="32" y="'+(H-38)+'" width="'+(W-64)+'" height="30" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>'
        +dots(1,yGk,'#fbbf24','GK')
        +dots(df,yDf,'#60a5fa','DF')
        +dots(mf,yMf,'#34d399','MF')
        +dots(fw,yFw,'#f87171','FW');
    }

    function toggleFormationHalf(matchId, half) {
      if (!state.activeFormationHalf) state.activeFormationHalf = {};
      state.activeFormationHalf[matchId] = half;
      render();
    }

    function toggleFormation(matchId) {
      if (!state.collapsedFormations) state.collapsedFormations = {};
      state.collapsedFormations[matchId] = !state.collapsedFormations[matchId];
      render();
    }

    function renderFormationSection(match) {
      if (!state.activeFormationHalf) state.activeFormationHalf = {};
      if (!state.collapsedFormations) state.collapsedFormations = {};
      // Default to collapsed if not explicitly set to false
      const isCollapsed = state.collapsedFormations[match.id] !== false;
      const chevron = isCollapsed ? '&#x25BC;' : '&#x25B2;';

      const halves = ['\u524d\u534a','\u5f8c\u534a'];
      let countText = '';
      if (state.players && state.players.length > 0) {
        const counts = halves.map(h => {
          const f = (match.formation && match.formation[h]) ? match.formation[h] : {df:3,mf:3,fw:1};
          const req = f.df + f.mf + f.fw + 1;
          let assigned = 0;
          let restingCount = 0;
          state.players.forEach(p => {
            const s = match.appearances[h] ? match.appearances[h][p] : null;
            if (s && s !== 'none' && s !== 'rest') {
              assigned++;
            } else if (!s || s === 'none' || s === 'rest') {
              restingCount++;
            }
          });
          const color = assigned === req ? 'var(--accent-green)' : (assigned > req ? 'var(--accent-red)' : 'var(--text-muted)');
          return h + ': <span style="color:'+color+'; font-weight:700;">' + assigned + '/' + req + '人</span> <span style="font-size:0.75rem; color:var(--text-muted); margin-left:4px;">(休: ' + restingCount + ')</span>';
        });
        countText = '<span style="font-size:0.7rem; color:var(--text-muted); margin-left:8px; font-weight:normal;">(' + counts.join(', ') + ')</span>';
      }

      const titleHtml = '<div class="formation-title" style="display:flex; justify-content:space-between; align-items:center; cursor:pointer; margin-bottom:'+(isCollapsed?'0':'12px')+';" onclick="toggleFormation(\''+match.id+'\')">'
         + '<div style="display:flex; align-items:center;"><span>&#x1F9E9; \u30d5\u30a9\u30fc\u30e1\u30fc\u30b7\u30e7\u30f3</span>' + countText + '</div>'
         + '<span style="font-size:0.8rem; padding:4px;">'+chevron+'</span>'
         + '</div>';

      if (isCollapsed) {
        return '<div class="formation-section">' + titleHtml + '</div>';
      }

      const activeHalf = state.activeFormationHalf[match.id] || halves[0];
      
      const tabs = halves.map(half => {
        const isActive = half === activeHalf;
        const bg = isActive ? 'var(--accent-primary)' : 'transparent';
        const color = isActive ? 'white' : 'var(--text-muted)';
        return '<button class="btn btn-ghost" style="flex:1; background:'+bg+'; color:'+color+'; font-size:0.85rem; border-radius:50px; padding:6px;" onclick="toggleFormationHalf(\''+match.id+'\', \''+half+'\')">'+half+'</button>';
      }).join('');
      const tabsHtml = '<div style="display:flex; gap:4px; background:rgba(30,41,59,0.5); padding:4px; border-radius:50px; margin-bottom:12px; max-width:200px; margin-left:auto; margin-right:auto;">'+tabs+'</div>';

      let halvesHtml = halves.map((half, idx) => {
        if (half !== activeHalf) return '';
        const f = (match.formation && match.formation[half]) ? match.formation[half] : {df:3,mf:3,fw:1};
        const badgeId = 'formation-badge-'+match.id+'-'+(idx+1);
        const svgId = 'pitch-svg-'+match.id+'-'+(idx+1);
        function spinner(pos, lblClass) {
          return '<div class="formation-field">'
            +'<label class="'+lblClass+'-label">'+pos.toUpperCase()+'</label>'
            +'<div class="formation-num">'
            +'<button onclick="updateFormation(\''+match.id+'\',\''+half+'\',\''+pos+'\',-1)">&minus;</button>'
            +'<span id="f-'+match.id+'-'+half+'-'+pos+'">'+f[pos]+'</span>'
            +'<button onclick="updateFormation(\''+match.id+'\',\''+half+'\',\''+pos+'\',1)">&#xFF0B;</button>'
            +'</div></div>';
        }
        return '<div class="formation-half-block" style="max-width:400px; margin:0 auto;">'
          +'<div style="display:flex;align-items:center;justify-content:center;margin-bottom:8px">'
          +'<span class="formation-badge" id="'+badgeId+'">GK-'+f.df+'-'+f.mf+'-'+f.fw+'</span>'
          +'</div>'
          +'<div class="pitch-wrap">'
          +'<svg id="'+svgId+'" viewBox="0 0 140 200" class="pitch-svg-container" xmlns="http://www.w3.org/2000/svg">'
          +buildPitchContent(f, match, half)
          +'</svg></div>'
          +'<div class="formation-inputs" style="justify-content:center; margin-top:8px;">'+spinner('df','df')+spinner('mf','mf')+spinner('fw','fw')+'</div>'
          +'<div style="text-align:center; margin-top:12px;">'
          +'<button class="btn ' + (isFormationDragMode ? 'btn-primary' : 'btn-ghost') + ' btn-sm" style="padding:6px 16px; border-radius:50px; font-size:0.8rem; border:1px solid var(' + (isFormationDragMode ? '--accent-primary' : '--border-glass') + ');" onclick="toggleFormationDragMode()">'
          +(isFormationDragMode ? '&#x2714;&#xFE0F; 位置修正を完了' : '&#x2194;&#xFE0F; 丸の位置を修正する')
          +'</button></div>'
          +'</div>';
      }).join('');
      return '<div class="formation-section">' + titleHtml
        +tabsHtml+'<div class="formation-halves">'+halvesHtml+'</div></div>';
    }

    // ===== Position Select =====
    let currentPosMatch = '';
    let currentPosHalf = '';
    let currentPosStr = '';
    function openPositionModal(matchId, half, posStr) {
      currentPosMatch = matchId;
      currentPosHalf = half;
      currentPosStr = posStr;
      const displayPos = posStr === 'gk' ? 'GK' : posStr;
      document.getElementById('posModalTitle').textContent = displayPos + ' の選手を選択';
      
      const match = state.matches.find(m => m.id === matchId);
      if (!match) return;
      
      let html = `<button class="btn btn-ghost" style="width:100%; justify-content:center; padding:12px; margin-bottom:12px; border:1px solid rgba(239,68,68,0.3); color:var(--accent-red);" onclick="clearPosition()">はずす (クリア)</button>`;
      
      state.players.forEach(p => {
         const currentStatus = match.appearances[half][p] || 'none';
         if (currentStatus !== 'none' && currentStatus !== 'play' && currentStatus !== posStr) {
           return;
         }
         const isAssignedToThis = currentStatus === posStr;
         const label = currentStatus === 'none' ? '' : ` <span style="font-size:0.7rem; color:var(--text-muted);">(${currentStatus === 'play' ? '出場' : currentStatus})</span>`;
         const bg = isAssignedToThis ? 'rgba(99,102,241,0.15)' : 'transparent';
         const border = isAssignedToThis ? 'border:1px solid var(--accent-primary);' : 'border:1px solid var(--border-glass);';
         html += `<button class="btn btn-ghost" style="width:100%; justify-content:flex-start; padding:12px; margin-bottom:6px; background:${bg}; ${border}" onclick="setPlayerForPosition('${escHtml(p)}')">${escHtml(p)}${label}</button>`;
      });
      document.getElementById('posModalList').innerHTML = html;
      document.getElementById('posModal').classList.add('active');
    }
    function setPlayerForPosition(playerName) {
      const match = state.matches.find(m => m.id === currentPosMatch);
      if (match) {
        state.players.forEach(p => {
           if (match.appearances[currentPosHalf][p] === currentPosStr) {
              match.appearances[currentPosHalf][p] = 'none';
           }
        });
        match.appearances[currentPosHalf][playerName] = currentPosStr;
        saveState(); render();
      }
      closeModal('posModal');
    }
    function clearPosition() {
      const match = state.matches.find(m => m.id === currentPosMatch);
      if (match) {
        state.players.forEach(p => {
           if (match.appearances[currentPosHalf][p] === currentPosStr) {
              match.appearances[currentPosHalf][p] = 'none';
           }
        });
        saveState(); render();
      }
      closeModal('posModal');
    }

    // ===== Appearance =====
    let currentStatusMatch = '';
    let currentStatusHalf = '';
    let currentStatusPlayer = '';
    function openStatusModal(matchId, half, playerName) {
      currentStatusMatch = matchId;
      currentStatusHalf = half;
      currentStatusPlayer = playerName;
      document.getElementById('statusModalTitle').textContent = escHtml(playerName) + ' (' + half + ')';
      
      const match = state.matches.find(m => m.id === matchId);
      const f = (match && match.formation && match.formation[half]) ? match.formation[half] : {df:3,mf:3,fw:1};
      
      let html = '';
      function addBtns(prefix, count, color, bg) {
        for(let i=1; i<=count; i++) {
           html += '<button class="btn btn-ghost" style="background:'+bg+'; color:'+color+'; font-size:0.95rem; font-weight:800; height:44px; flex:1 1 calc(33% - 8px); min-width:64px;" onclick="setStatusFromModal(\''+prefix+i+'\')">'+prefix+i+'</button>';
        }
      }
      addBtns('DF', f.df, '#60a5fa', 'rgba(96,165,250,0.15)');
      addBtns('MF', f.mf, '#34d399', 'rgba(52,211,153,0.15)');
      addBtns('FW', f.fw, '#f87171', 'rgba(248,113,113,0.15)');
      
      document.getElementById('statusModalButtons').innerHTML = html;
      document.getElementById('statusModal').classList.add('active');
    }
    function setStatusFromModal(val) {
      const match = state.matches.find(m => m.id === currentStatusMatch);
      if (match) {
        match.appearances[currentStatusHalf][currentStatusPlayer] = val;
        saveState(); render();
      }
      closeModal('statusModal');
    }
    function getStatusDisplay(status) {
      if (status==='play') return '&#x25CB;';
      if (status==='gk') return 'GK';
      if (status==='rest') return '<span style="color:var(--text-muted); font-weight:bold;">休</span>';
      if (status==='none') return '<span class="none-dash">-</span>';
      if (status.startsWith('DF') || status.startsWith('MF') || status.startsWith('FW')) {
         let color = '#60a5fa';
         if (status.startsWith('MF')) color = '#34d399';
         if (status.startsWith('FW')) color = '#f87171';
         return `<span style="color:${color}; font-size:0.8rem; letter-spacing:-0.5px;">${status}</span>`;
      }
      return '';
    }

    function openRestingPlayersModal(matchId, half) {
      if (state.editMode || state.playerEditMode) return;
      const match = state.matches.find(m => m.id === matchId);
      if (!match) return;
      
      document.getElementById('restingPlayersModalTitle').innerHTML = '&#x2615; ' + escHtml(match.name) + ' (' + half + ') の休憩者';
      
      let resting = [];
      state.players.forEach(p => {
        const s = match.appearances[half][p];
        if (!s || s === 'none' || s === 'rest') resting.push(p);
      });
      
      let html = '';
      if (resting.length === 0) {
        html = '<p style="color:var(--text-muted); font-size:0.9rem; margin-bottom:0;">休憩者はいません</p>';
      } else {
        resting.forEach(p => {
          html += '<span style="background:rgba(255,255,255,0.05); border:1px solid var(--border-subtle); border-radius:var(--radius-sm); padding:6px 12px; font-size:0.9rem; color:var(--text-primary);">' + escHtml(p) + '</span>';
        });
      }
      
      document.getElementById('restingPlayersList').innerHTML = html;
      document.getElementById('restingPlayersModal').classList.add('active');
    }

    function openPlayerHistoryModal(playerName) {
      document.getElementById('playerHistoryModalTitle').innerHTML = '&#x1F4CB; ' + escHtml(playerName) + ' の履歴';
      let html = '';
      if (state.matches.length === 0) {
        html = '<p style="text-align:center; color:var(--text-muted); font-size:0.9rem;">試合がありません</p>';
      } else {
        state.matches.forEach(m => {
          const getPosName = (half) => {
            const s = m.appearances[half][playerName];
            if (!s || s === 'none' || s === 'rest') return '<span style="color:var(--text-muted);">休</span>';
            if (s === 'gk') return '<span style="color:var(--accent-amber);font-weight:bold;">GK</span>';
            if (s === 'play') return '<span style="color:var(--accent-green);font-weight:bold;">出場 (未定)</span>';
            if (s.startsWith('DF')) return '<span style="color:#60a5fa;font-weight:bold;">' + s + '</span>';
            if (s.startsWith('MF')) return '<span style="color:#34d399;font-weight:bold;">' + s + '</span>';
            if (s.startsWith('FW')) return '<span style="color:#f87171;font-weight:bold;">' + s + '</span>';
            return '<span style="font-weight:bold;color:var(--text-primary);">' + s + '</span>';
          };
          html += '<div style="background:rgba(30,41,59,0.5); border:1px solid var(--border-subtle); border-radius:var(--radius-sm); padding:10px;">'
                + '<div style="font-weight:bold; color:var(--text-primary); margin-bottom:6px; font-size:0.9rem;">' + escHtml(m.name) + '</div>'
                + '<div style="display:flex; justify-content:space-between; font-size:0.85rem;">'
                + '<div><span style="color:var(--text-muted); margin-right:4px;">前半:</span> ' + getPosName('\u524d\u534a') + '</div>'
                + '<div><span style="color:var(--text-muted); margin-right:4px;">後半:</span> ' + getPosName('\u5f8c\u534a') + '</div>'
                + '</div></div>';
        });
      }
      document.getElementById('playerHistoryList').innerHTML = html;
      document.getElementById('playerHistoryModal').classList.add('active');
    }

    // ===== Counting =====
    function countPlayerTotal(playerName) {
      let fp=0, gk=0;
      state.matches.forEach(m => { 
        ['\u524d\u534a','\u5f8c\u534a'].forEach(h => { 
          const s=m.appearances[h][playerName]; 
          if (s) {
            if (s==='play' || (s>='1' && s<='7') || s.startsWith('DF') || s.startsWith('MF') || s.startsWith('FW')) fp++; 
            else if(s==='gk') gk++;
          }
        }); 
      });
      return { fp, gk, total: fp+gk };
    }
    function countPlayerInMatch(matchId, playerName) {
      const match = state.matches.find(m => m.id === matchId);
      if (!match) return { fp:0, gk:0, total:0 };
      let fp=0, gk=0;
      ['\u524d\u534a','\u5f8c\u534a'].forEach(h => { 
        const s=match.appearances[h][playerName]; 
        if (s) {
          if (s==='play' || (s>='1' && s<='7') || s.startsWith('DF') || s.startsWith('MF') || s.startsWith('FW')) fp++; 
          else if(s==='gk') gk++;
        }
      });
      return { fp, gk, total: fp+gk };
    }

    // ===== Edit Mode =====
    function toggleEditMode() {
      state.editMode = !state.editMode;
      const btn = document.getElementById('editToggle');
      btn.classList.toggle('active', state.editMode);
      btn.innerHTML = state.editMode ? '&#x270F;&#xFE0F; 完 了' : '&#x270F;&#xFE0F; 試合編集';
      render();
    }
    function togglePlayerEditMode(cancel = false) {
      state.playerEditMode = !state.playerEditMode;
      if (state.playerEditMode) {
        document.body.classList.add('player-edit-active');
      } else {
        document.body.classList.remove('player-edit-active');
      }
      render();
    }

    // ===== Modal =====
    function closeModal(id) { document.getElementById(id).classList.remove('active'); }
    document.querySelectorAll('.modal-overlay').forEach(overlay => {
      overlay.addEventListener('click', (e) => { if (e.target === overlay) closeModal(overlay.id); });
    });
    document.getElementById('playerNameInput').addEventListener('keydown', e => { if (e.key==='Enter') addPlayer(); });
    document.getElementById('matchTimeInput').addEventListener('keydown', e => { if (e.key==='Enter') addMatch(); });

    // ===== Rendering =====
    function renderSummaryBar() {
      // Removed top summary bar per user request
    }

    function renderMatches() {
      const main = document.getElementById('mainContent');
      if (state.matches.length===0 && state.players.length===0) {
        main.innerHTML='<div class="empty-state"><div class="empty-icon">&#x1F3DF;&#xFE0F;</div><p>\u8a66\u5408\u3092\u8ffd\u52a0\u3057\u3066\u304f\u3060\u3055\u3044</p><button class="btn btn-primary" onclick="openMatchModal()">\uD83C\uDFDF\uFE0F \u8a66\u5408\u3092\u8ffd\u52a0</button><br><br><button class="btn btn-success" onclick="openPlayerModal()">&#xFF0B; 選手を追加</button></div>';
        return;
      }
      let html='';
      state.matches.forEach(m => { html += renderMatchCard(m); });
      if (state.players.length>0) html += renderTotalSummary();
      
      let actionBtns = '';
      if (!state.playerEditMode) {
        actionBtns += '<div style="display:flex; align-items:center; gap:8px;">';
        actionBtns += '<span style="font-size:0.9rem; font-weight:bold; color:var(--text-secondary); margin-right:4px;">登録: ' + state.players.length + '人</span>';
        actionBtns += '<button class="btn btn-success" style="padding:10px 20px; font-size:1rem;" onclick="openPlayerModal()">&#xFF0B; 選手</button>';
        actionBtns += '</div>';
        if (state.players.length > 0) {
          actionBtns += '<button class="btn btn-ghost" style="padding:10px 20px; font-size:1rem;" onclick="togglePlayerEditMode()">&#x270F;&#xFE0F; 選手編集</button>';
        }
      } else {
        actionBtns += '<button class="btn btn-ghost" style="padding:10px 20px; font-size:1rem;" onclick="togglePlayerEditMode(true)">&#x2716;&#xFE0F; キャンセル</button>';
        actionBtns += '<button class="btn btn-primary" style="padding:10px 20px; font-size:1rem;" onclick="togglePlayerEditMode()">&#x2714;&#xFE0F; 完了</button>';
      }
      html += '<div class="data-actions" style="justify-content:center; gap:16px; margin-top:20px; position:relative; z-index:110;">' + actionBtns + '</div>';
      main.innerHTML = html;

      // Synchronize horizontal scrolling across all tables
      const wrappers = document.querySelectorAll('.table-wrapper');
      let isSyncing = false;
      wrappers.forEach(wrap => {
        wrap.addEventListener('scroll', (e) => {
          if (!isSyncing) {
            isSyncing = true;
            const sl = e.target.scrollLeft;
            wrappers.forEach(other => {
              if (other !== e.target) other.scrollLeft = sl;
            });
            window.requestAnimationFrame(() => { isSyncing = false; });
          }
        });
      });
    }

    function renderMatchCard(match) {
      const editClass = state.editMode ? 'edit-mode' : '';
      let editRow='';
      if (state.editMode) {
        editRow='<div class="match-edit-row">'
          +'<input type="text" value="'+escHtml(match.name)+'" placeholder="\u8a66\u5408\u540d" onchange="updateMatchField(\''+match.id+'\',\'name\',this.value)" style="flex:1.2">'
          +'<input type="text" value="'+escHtml(match.opponent)+'" placeholder="\u5bfe\u6226\u76f8\u624b" onchange="updateMatchField(\''+match.id+'\',\'opponent\',this.value)" style="flex:1">'
          +'<input type="text" value="'+escHtml(match.time)+'" placeholder="\u6642\u9593" onchange="updateMatchField(\''+match.id+'\',\'time\',this.value)" style="flex:0.6">'
          +'</div>';
      }
      let playerHeaders = state.players.map(p => {
        return '<th class="player-col">'+escHtml(p)+'</th>';
      }).join('');
      const halves=['\u524d\u534a','\u5f8c\u534a'];
      let rows='';
      halves.forEach((half,idx) => {
        const halfClass=idx===1?'second-half':'';
        let cells=state.players.map(player => {
          const status=match.appearances[half][player]||'none';
          const display=getStatusDisplay(status);
          let cellStatus = 'none';
          if (status==='gk') cellStatus = 'gk';
          else if (status==='play' || (status>='1' && status<='7') || status.startsWith('DF') || status.startsWith('MF') || status.startsWith('FW')) cellStatus = 'play';
          return '<td class="cell" data-status="'+cellStatus+'" onclick="openStatusModal(\''+match.id+'\',\''+half+'\',\''+escHtml(player)+'\')">'
            +'<div class="cell-content">'+display+'</div></td>';
        }).join('');
        rows+='<tr><td class="half-label '+halfClass+'" style="cursor:pointer; text-decoration:underline; text-decoration-color:var(--border-subtle); text-underline-offset:2px;" onclick="openRestingPlayersModal(\''+match.id+'\',\''+half+'\')">'+half+'</td>'+cells+'</tr>';
      });
      let countCells=state.players.map(player => {
        const counts=countPlayerInMatch(match.id,player);
        let label = '-';
        if (counts.total > 0) {
          if (counts.gk > 0 && counts.fp > 0) label = `F${counts.fp}/G${counts.gk}`;
          else if (counts.gk > 0) label = `G${counts.gk}`;
          else label = counts.fp;
        }
        return '<td>'+label+'</td>';
      }).join('');
      rows+='<tr class="count-row"><td class="count-label">\u51fa\u5834</td>'+countCells+'</tr>';
      const metaTime=match.time?'<span>&#x1F550; '+escHtml(match.time)+'</span>':'';
      const metaOpp=match.opponent?'<span>VS '+escHtml(match.opponent)+'</span>':'';
      return '<div class="match-card '+editClass+'" id="match-'+match.id+'">'
        +'<div class="match-header"><div class="match-info"><div class="match-name">'+escHtml(match.name)+'</div><div class="match-meta">'+metaTime+metaOpp+'</div></div>'
        +'<div class="match-actions">'+(state.editMode?'<button class="btn btn-danger btn-sm" onclick="removeMatch(\''+match.id+'\')">\u524a\u9664</button>':'')+'</div></div>'
        +editRow
        +renderFormationSection(match)
        +'<div class="table-wrapper"><table class="match-table"><thead><tr><th style="min-width:50px;"></th>'+playerHeaders+'</tr></thead><tbody>'+rows+'</tbody></table></div>'
        +'</div>';
    }

    function renderTotalSummary() {
      const max=state.matches.length*2;
      const items=state.players.map(player => {
        const counts=countPlayerTotal(player);
        const count=counts.total;
        let cls='zero';
        if (max>0) { const r=count/max; if(r>=0.7) cls='top'; else if(r>=0.4) cls='mid'; else if(r>0) cls='low'; }
        const gkHtml = counts.gk > 0 ? `<span style="font-size:0.65rem;color:var(--text-muted);margin-right:6px;">FP:${counts.fp} GK:${counts.gk}</span>` : '';
        
        let actions = '';
        if (state.playerEditMode) {
          actions = '<button class="btn btn-ghost btn-sm" style="padding:2px 8px; color:var(--accent-cyan); font-size:0.8rem;" onclick="editPlayer(\''+escHtml(player)+'\')">&#x270F;&#xFE0F;</button>'
                  + '<button class="btn btn-ghost btn-sm" style="padding:2px 8px; color:var(--accent-red); font-size:1rem;" onclick="removePlayer(\''+escHtml(player)+'\')">&#x1F5D1;&#xFE0F;</button>';
        }
        
        const countDisplay = state.playerEditMode ? '' : '<div style="margin-left:auto;">'+gkHtml+'<span class="total-count '+cls+'">'+count+'</span></div>';

        const nameDisplay = state.playerEditMode 
            ? '<span class="player-name">'+escHtml(player)+'</span>'
            : '<span class="player-name" style="cursor:pointer; color:var(--text-primary); text-decoration:underline; text-decoration-color:var(--border-subtle); text-underline-offset:4px;" onclick="openPlayerHistoryModal(\''+escHtml(player)+'\')">'+escHtml(player)+'</span>';

        return '<div class="total-item" style="display:flex; align-items:center; gap:8px;">'
             + actions
             + nameDisplay
             + countDisplay
             + '</div>';
      }).join('');
      return '<div class="total-section">'
        +'<div class="total-card">'
        +'<div class="total-grid">'+items+'</div></div></div>';
    }

    function render() { renderSummaryBar(); renderMatches(); }

    // ===== Data Management =====
    function resetAll() {
      if (!confirm('\u5168\u3066\u306e\u30c7\u30fc\u30bf\u3092\u524a\u9664\u3057\u307e\u3059\u304b\uff1f\n\u3053\u306e\u64cd\u4f5c\u306f\u53d6\u308a\u6d88\u305b\u307e\u305b\u3093\u3002')) return;
      state.players=[]; state.matches=[]; state.editMode=false;
      const btn=document.getElementById('editToggle');
      btn.classList.remove('active'); btn.textContent='&#x270F;&#xFE0F; \u7de8\u96c6';
      saveState(); render();
      showToast('\uD83D\uDDD1\uFE0F \u5168\u30c7\u30fc\u30bf\u3092\u524a\u9664\u3057\u307e\u3057\u305f');
    }

    let isFormationDragMode = false;
    function toggleFormationDragMode() {
      isFormationDragMode = !isFormationDragMode;
      render();
    }

    // ===== Draggable Formations =====
    let dragElement = null;
    let dragStartCoords = {x:0, y:0};
    let dragHasMoved = false;
    let longPressTimer = null;
    let isSwappingMode = false;

    function handlePointerDown(e) {
      const g = e.target.closest('.draggable-pos');
      if (!g) return;
      
      dragElement = g;
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      dragStartCoords = { x: clientX, y: clientY };
      dragHasMoved = false;
      
      const tf = dragElement.getAttribute('transform');
      let cx = 0, cy = 0;
      if (tf) {
        const m = tf.match(/translate\(([^,]+),\s*([^\)]+)\)/);
        if (m) { cx = parseFloat(m[1]); cy = parseFloat(m[2]); }
      }
      dragElement.dataset.origX = cx;
      dragElement.dataset.origY = cy;

      if (!isFormationDragMode) {
        isSwappingMode = false;
        if (longPressTimer) clearTimeout(longPressTimer);
        longPressTimer = setTimeout(() => {
          isSwappingMode = true;
          dragElement.style.opacity = '0.5';
          if (navigator.vibrate) navigator.vibrate(50);
        }, 400);
        return; // Don't prevent default, allow scrolling
      }
      
      dragElement.style.opacity = '0.7';
      if (e.type === 'touchstart') e.preventDefault();
    }

    function handlePointerMove(e) {
      if (!dragElement) return;
      
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;

      const dx = clientX - dragStartCoords.x;
      const dy = clientY - dragStartCoords.y;
      
      if (!dragHasMoved && Math.hypot(dx, dy) > 5) {
        dragHasMoved = true;
        if (!isFormationDragMode && !isSwappingMode) {
          if (longPressTimer) clearTimeout(longPressTimer);
          longPressTimer = null;
          dragElement = null;
          return;
        }
      }

      if (dragHasMoved) {
        if (!isFormationDragMode && isSwappingMode && e.type === 'touchmove') {
           e.preventDefault(); // Prevent scroll while swapping
        }
        
        const svg = dragElement.closest('svg');
        const rect = svg.getBoundingClientRect();
        const scaleX = 140 / rect.width;
        const scaleY = 200 / rect.height;
        
        let newX = parseFloat(dragElement.dataset.origX) + dx * scaleX;
        let newY = parseFloat(dragElement.dataset.origY) + dy * scaleY;
        
        if (newX < 10) newX = 10; if (newX > 130) newX = 130;
        if (newY < 10) newY = 10; if (newY > 190) newY = 190;
        
        dragElement.setAttribute('transform', 'translate('+newX+','+newY+')');
      }
      
      if (isFormationDragMode && e.type === 'touchmove') e.preventDefault();
    }

    function handlePointerUp(e) {
      if (!dragElement) return;
      if (longPressTimer) clearTimeout(longPressTimer);
      
      dragElement.style.opacity = '1';

      const matchId = dragElement.dataset.match;
      const half = dragElement.dataset.half;
      const posStr = dragElement.dataset.pos;

      if (!isFormationDragMode) {
        if (isSwappingMode) {
           dragElement.setAttribute('transform', 'translate('+dragElement.dataset.origX+','+dragElement.dataset.origY+')');
           const clientX = e.changedTouches ? e.changedTouches[0].clientX : e.clientX;
           const clientY = e.changedTouches ? e.changedTouches[0].clientY : e.clientY;
           
           dragElement.style.display = 'none';
           const dropTarget = document.elementFromPoint(clientX, clientY);
           dragElement.style.display = '';
           
           const targetG = dropTarget ? dropTarget.closest('.draggable-pos') : null;
           if (targetG && targetG !== dragElement && targetG.dataset.match === matchId && targetG.dataset.half === half) {
             const targetPosStr = targetG.dataset.pos;
             const match = state.matches.find(m => m.id === matchId);
             if (match) {
               let p1 = null, p2 = null;
               state.players.forEach(p => {
                 if (match.appearances[half][p] === posStr) p1 = p;
                 if (match.appearances[half][p] === targetPosStr) p2 = p;
               });
               if (p1) match.appearances[half][p1] = targetPosStr;
               if (p2) match.appearances[half][p2] = posStr;
               saveState();
             }
           }
           render();
        } else {
           if (!dragHasMoved) openPositionModal(matchId, half, posStr);
        }
      } else {
        if (!dragHasMoved) {
          openPositionModal(matchId, half, posStr);
        } else {
          const tf = dragElement.getAttribute('transform');
          if (tf) {
            const m = tf.match(/translate\(([^,]+),\s*([^\)]+)\)/);
            if (m) {
               const cx = parseFloat(m[1]);
               const cy = parseFloat(m[2]);
               if (!state.customPositions) state.customPositions = {};
               if (!state.customPositions[matchId]) state.customPositions[matchId] = {};
               if (!state.customPositions[matchId][half]) state.customPositions[matchId][half] = {};
               state.customPositions[matchId][half][posStr] = { x: cx, y: cy };
               saveState();
            }
          }
        }
      }
      
      dragElement = null;
      isSwappingMode = false;
    }

    document.addEventListener('mousedown', handlePointerDown);
    document.addEventListener('mousemove', handlePointerMove);
    document.addEventListener('mouseup', handlePointerUp);
    document.addEventListener('touchstart', handlePointerDown, {passive: false});
    document.addEventListener('touchmove', handlePointerMove, {passive: false});
    document.addEventListener('touchend', handlePointerUp);

    // ===== Init =====
    loadState();
    render();
  </script>
</body>
</html>
